[package]
name = "fintrack-rust"
version = "0.1.0"
edition = "2021"
description = "Aplicacao fullstack em Rust para gestao e analise de carteira de investimentos."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["fs", "trace"] }
