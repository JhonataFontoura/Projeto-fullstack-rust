[package]
name = "fintrack-rust"
version = "0.7.0"
edition = "2021"
description = "Aplicacao fullstack em Rust para gestao e analise de carteira de investimentos."

[dependencies]
askama = "0.14"
argon2 = "0.5"
axum = { version = "0.8", features = ["form"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = "9"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
